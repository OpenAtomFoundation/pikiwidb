# =======================
# RocksDB Compaction and Write Settings
# =======================

# The maximum size of the write-ahead logs (WAL). 
# When the total size of WAL files exceeds this limit, RocksDB will force the flush of column families.
ingest.aggr.max_total_wal_size : 268435456  # 1GB

# 导入期：触发压缩和写入暂停的 L0 阈值
ingest.aggr.level0-file-num-compaction-trigger : 20
ingest.aggr.level0-slowdown-writes-trigger : 60
ingest.aggr.level0-stop-writes-trigger : 120

# 导入期：pending bytes 限制
ingest.aggr.soft-pending-compaction-bytes-limit : 4294967296  # 500GB
ingest.aggr.hard-pending-compaction-bytes-limit : 8589934592  # 1TB

# 禁用自动 compaction 以提高导入速度
ingest.aggr.disable-auto-compactions : true

# =======================
# Restore (Production) Configuration
# =======================
ingest.restore.max_total_wal_size : 268435456  # 256MB

# 恢复期：恢复 L0 阈值（生产期使用更保守的配置）
ingest.restore.level0-file-num-compaction-trigger : 10
ingest.restore.level0-slowdown-writes-trigger : 60
ingest.restore.level0-stop-writes-trigger : 120

# 恢复期：恢复 pending bytes 限制
ingest.restore.soft-pending-compaction-bytes-limit : 67108864000  # 64GB
ingest.restore.hard-pending-compaction-bytes-limit : 134217728000  # 128GB

# 恢复期：恢复自动 compaction
ingest.restore.disable-auto-compactions : false

# 恢复期：恢复最大背景作业和子压缩作业数
ingest.restore.max-background-jobs : 4
ingest.restore.max-subcompactions : 2

# =======================
# Ingest Operations and Options
# =======================

# Enable or disable move files after ingesting.
ingest.options.move-files : true

# Verify checksums before ingesting to ensure the integrity of the data.
ingest.options.verify-checksums-before-ingest : true

# Maintain snapshot consistency during ingestion for reliable data visibility.
ingest.options.snapshot-consistency : true

# Allow blocking flush during ingestion if the memory is full, otherwise non-blocking flush is used.
ingest.options.allow-blocking-flush : true

# Optionally ingest data behind the current snapshot, which helps reduce write conflicts in certain cases.
ingest.options.ingest-behind : false
