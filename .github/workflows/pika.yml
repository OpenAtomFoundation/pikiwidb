name: Pika

on:
  push:
    branches: [ "unstable", "3.5" , "4.0"]
  pull_request:
    branches: [ "unstable", "3.5" , "4.0"]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: RelWithDebInfo
  ARTIFACT_PIKA_NAME: artifact-pika

jobs:
  build_on_ubuntu:
    # The CMake configure and build commands are platform-agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.19

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.13
        with:
          key: ubuntu-latest

      - name: Install Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf libprotobuf-dev protobuf-compiler clang-tidy

      - name: Configure CMake
        # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
        # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DUSE_PIKA_TOOLS=ON -DCMAKE_CXX_FLAGS_DEBUG=-fsanitize=address -D CMAKE_C_COMPILER_LAUNCHER=ccache -D CMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        # Build your program with the given configuration
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Cleanup Build Trees
        run: |
          rm -rf ./buildtrees
          rm -rf ./deps
          df -h

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PIKA_NAME }}
          path: ${{ github.workspace }}/build/pika

      - name: Test
        working-directory: ${{ github.workspace }}/build
        # Execute tests defined by the CMake configuration.
        # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
        run: ctest -C ${{ env.BUILD_TYPE }} --verbose

      - name: Unit Test
        working-directory: ${{ github.workspace }}
        run: ./pikatests.sh all clean

      - name: Cleanup Build Artifacts
        run: |
          find ./build -name "*.o" -type f -delete
          find ./build -name "*.a" -type f -delete
          rm -rf ./build/CMakeFiles
          rm -rf ./build/_deps
          df -h

        # master on port 9221, slave on port 9231, all with 2 db
      - name: Start codis, pika master and pika slave
        working-directory: ${{ github.workspace }}/build
        run: |
          echo "hello"
          chmod +x ../tests/integration/start_master_and_slave.sh
          ../tests/integration/start_master_and_slave.sh
          chmod +x ../tests/integration/start_codis.sh
          ../tests/integration/start_codis.sh

      - name: Run Go E2E Tests
        working-directory: ${{ github.workspace }}/build
        run: |
          cd ../tools/pika_keys_analysis/
          go test -v ./...
          cd ../../tests/integration/
          chmod +x integrate_test.sh
          sh integrate_test.sh

      - name: Cleanup Test Data
        if: always()
        working-directory: ${{ github.workspace }}/build
        run: |
          pkill -9 pika || true
          pkill -9 codis || true
          rm -rf master_data slave_data rename_data acl1_data acl2_data acl3_data
          rm -rf codis_data_1 codis_data_2
          rm -rf *.conf *.conf.bak
          df -h


  build_on_centos:
    runs-on: ubuntu-latest
    container:
      image: cheniujh/pika-centos7-ci:v5

    steps:
      - name: Free Disk Space
        run: |
          rm -rf /usr/share/dotnet
          rm -rf /opt/ghc
          rm -rf /usr/local/share/boost
          df -h

      - name: Checkout
        uses: actions/checkout@v1
        with:
          fetch-depth: 0

      - name: Configure CMake
        run: |
          source /opt/rh/devtoolset-10/enable
          cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DUSE_PIKA_TOOLS=ON -DCMAKE_CXX_FLAGS_DEBUG=-fsanitize=address

      - name: Build
        run: |
          source /opt/rh/devtoolset-10/enable
          cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Cleanup Build Trees and Intermediate Files
        run: |
          rm -rf ./buildtrees
          # 只清理非必要的构建中间文件，保留可执行文件和关键目录
          find ./build -path "*/CMakeFiles/*.o" -delete || true
          find ./build -path "*/CMakeFiles/*.a" -delete || true
          # 保留codis目录和重要结构
          df -h

      - name: Test
        working-directory: ${{ github.workspace }}/build
        run: ctest -C ${{ env.BUILD_TYPE }}

      - name: Unit Test
        working-directory: ${{ github.workspace }}
        run: ./pikatests.sh all clean

      - name: Cleanup After Unit Test
        run: |
          # 清理单元测试产生的临时文件
          find ${{ github.workspace }} -name "log*" -type d -exec rm -rf {} + || true
          find ${{ github.workspace }} -name "db*" -type d -exec rm -rf {} + || true
          find ${{ github.workspace }} -name "dump*" -type d -exec rm -rf {} + || true
          find ${{ github.workspace }} -name "dbsync*" -type d -exec rm -rf {} + || true
          # 更彻底地清理临时文件
          find ${{ github.workspace }} -name "*.log" -type f -delete || true
          find ${{ github.workspace }} -name "*.tmp" -type f -delete || true
          find ${{ github.workspace }} -name "core.*" -type f -delete || true
          df -h

      - name: Cleanup Before Integration Tests
        working-directory: ${{ github.workspace }}/build
        run: |
          # 在启动集成测试前再次确认清理
          rm -rf ./log* ./db* ./dump* ./dbsync*
          df -h

      - name: Start codis, pika master and pika slave
        working-directory: ${{ github.workspace }}/build
        run: |
          chmod +x ../tests/integration/start_master_and_slave.sh
          ../tests/integration/start_master_and_slave.sh
          chmod +x ../tests/integration/start_codis.sh
          ../tests/integration/start_codis.sh

      - name: Run Go E2E Tests with Incremental Cleanup
        working-directory: ${{ github.workspace }}/build
        run: |
          # 在测试运行期间添加定期清理
          cd ../../tests/integration/
          chmod +x integrate_test.sh
          
          # 修改集成测试脚本，添加中间清理步骤
          sed -i 's/go test -run=TestPikaWithCache -timeout 60m/go test -run=TestPikaWithCache -timeout 30m/g' integrate_test.sh
          sed -i 's/go test -run=TestPikaWithoutCache -timeout 60m/go test -run=TestPikaWithoutCache -timeout 30m/g' integrate_test.sh
          
          # 运行测试并定期清理
          bash -c "while true; do find ${{ github.workspace }} -name \"db*\" -type d -mmin +10 -exec rm -rf {} + 2>/dev/null; sleep 60; done" &
          CLEANER_PID=$!
          
          # 运行测试
          sh integrate_test.sh || true
          
          # 停止清理进程
          kill $CLEANER_PID 2>/dev/null || true

      - name: Cleanup Test Data
        if: always()
        working-directory: ${{ github.workspace }}/build
        run: |
          rm -rf master_data slave_data rename_data acl1_data acl2_data acl3_data
          rm -rf codis_data_1 codis_data_2
          rm -rf *.conf *.conf.bak
          df -h


  build_on_macos:

    runs-on: macos-13

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.19

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.13
        with:
          key: macos-13

      - name: Install Deps
        run: |
           brew list --versions cmake && brew uninstall --ignore-dependencies --force cmake || true
           brew install gcc@10 automake cmake make binutils

      - name: Configure CMake
        run: |
          export CC=/usr/local/opt/gcc@10/bin/gcc-10 
          cmake -B build -DCMAKE_C_COMPILER=/usr/local/opt/gcc@10/bin/gcc-10 -DUSE_PIKA_TOOLS=ON -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_CXX_FLAGS_DEBUG=-fsanitize=address -D CMAKE_C_COMPILER_LAUNCHER=ccache -D CMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Cleanup
        run: |
          cp deps/lib/libz.1.dylib .
          cp deps/lib/libz.1.dylib tests/integration/
          rm -rf ./buildtrees

      - name: Test
        working-directory: ${{ github.workspace }}/build
        run: ctest -C ${{ env.BUILD_TYPE }} --verbose

      - name: Unit Test
        working-directory: ${{ github.workspace }}
        run: |
          ./pikatests.sh all clean

      - name: Start codis, pika master and pika slave
        working-directory: ${{ github.workspace }}
        run: |
          cd tests/integration/
          chmod +x start_master_and_slave.sh
          ./start_master_and_slave.sh
          chmod +x start_codis.sh
          ./start_codis.sh
          

      - name: Run Go E2E Tests
        working-directory: ${{ github.workspace }}
        run: |
          cd tests/integration/
          chmod +x integrate_test.sh
   #       sh integrate_test.sh

  build_pika_image:
    name: Build Pika Docker image
    runs-on: ubuntu-latest
    needs: build_on_ubuntu
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: pikadb/pika

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PIKA_NAME }}
          path: artifact/

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ci/Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
